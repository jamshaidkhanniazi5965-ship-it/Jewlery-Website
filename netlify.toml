[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Card source files and tools are not part of the public site
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cards/photos/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cards/michel.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Michel's digital business card: keep out of search engines, download the vCard
[[headers]]
  for = "/michel"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/michel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/michel.vcf"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Type = "text/vcard; charset=utf-8"
    Content-Disposition = "attachment; filename=\"Michel-Germani.vcf\""

[[headers]]
  for = "/cards/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
